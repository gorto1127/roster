<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable with AG Grid</title>
    <!-- AG Grid CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <!-- Google Fonts for authentic Google look -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 20px;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #fafafa;
        }
        #header {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        h1 {
            margin: 0;
            color: #3c4043;
            font-size: 1.8em;
            font-weight: 500;
            font-family: 'Google Sans', Roboto, sans-serif;
        }
        .refresh-btn {
            padding: 8px 16px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Google Sans', Roboto, sans-serif;
            font-weight: 500;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 3px rgba(66, 133, 244, 0.3);
        }
        .refresh-btn:hover {
            background: #0d62d9;
            box-shadow: 0 2px 6px rgba(66, 133, 244, 0.4);
        }
        .refresh-btn:active {
            transform: scale(0.98);
        }
        #status {
            color: #5f6368;
            font-size: 0.9em;
            font-family: 'Google Sans', Roboto, sans-serif;
        }
        #myGrid {
            width: 100%;
            height: calc(100vh - 140px);
            border: 1px solid #dadce0;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.1);
            overflow: hidden;
        }
        .info-box {
            background: #e8f0fe;
            border-left: 4px solid #1a73e8;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #3c4043;
            font-family: 'Google Sans', Roboto, sans-serif;
        }
        
        /* ===== GOOGLE MODERN LIGHT THEME ===== */
        
        /* 1. MAIN HEADER ROWS (First 2 rows) */
        .ag-header-row {
            background-color: #4a86e8 !important;
            color: white !important;
            font-weight: 500;
            font-size: 14px;
            font-family: 'Google Sans', Roboto, sans-serif;
        }
        
        .ag-header-cell {
            border-right: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
        
        /* 2. FROZEN HEADER CELLS (First 2 columns in header) */
        .ag-header-cell-pinned {
            background-color: #3a76d8 !important;
        }
        
        /* 3. FROZEN DATA CELLS (First 2 columns in body) */
        .ag-pinned-left-cols-container .ag-cell {
            background-color: #f8f9fa !important;
            border-right: 2px solid #dadce0 !important;
            font-weight: 500;
        }
        
        /* 4. ZEBRA STRIPING FOR DATA ROWS */
        .ag-row-even {
            background-color: #ffffff;
        }
        
        .ag-row-odd {
            background-color: #f8f9fa;
        }
        
        /* 5. HOVER EFFECTS */
        .ag-row:hover {
            background-color: #e8f0fe !important;
        }
        
        .ag-header-cell:hover {
            background-color: #3a76d8 !important;
        }
        
        .ag-pinned-left-cols-container .ag-row:hover .ag-cell {
            background-color: #e3e9f7 !important;
        }
        
        /* 6. BORDERS TO MATCH GOOGLE SHEETS */
        .ag-cell {
            border-right: 1px solid #dadce0 !important;
            border-bottom: 1px solid #dadce0 !important;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 13px;
        }
        
        .ag-header-cell::after,
        .ag-header-group-cell::after {
            border-right: 1px solid rgba(255, 255, 255, 0.3) !important;
        }
        
        /* 7. SCROLLBAR STYLING */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* 8. GRID THEME OVERRIDES */
        .ag-theme-alpine {
            --ag-border-color: #dadce0;
            --ag-header-background-color: #4a86e8;
            --ag-header-foreground-color: white;
            --ag-font-family: 'Roboto', Arial, sans-serif;
        }
        
        /* 9. SELECTION STYLING */
        .ag-row-selected {
            background-color: rgba(26, 115, 232, 0.08) !important;
        }
        
        .ag-cell-focus {
            border: 1px solid #1a73e8 !important;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>📅 Interactive Timetable</h1>
        <button class="refresh-btn" onclick="refreshGrid()">
            🔄 Refresh Timetable Data
        </button>
        <div id="status">Last updated: <span id="lastUpdateTime">-</span></div>
    </div>
    
    <div class="info-box">
        ✅ <strong>Columns A & B and Rows 1 & 2 are frozen</strong> – they stay visible while scrolling.<br>
        Click the refresh button above to fetch the latest data from the spreadsheet.
    </div>
    
    <!-- AG Grid container -->
    <div id="myGrid" class="ag-theme-alpine"></div>

    <script>
        // 1. YOUR GOOGLE SHEET CSV URL
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTiZPBjakCcNDOtJVDhayA6pH4_AR1kJT_3dz5sR5veWcadc8-JGDEaujCeoKQ9ynX0cVLpfxjX5Gex/pub?gid=0&single=true&output=csv';
        
        // 2. Global reference to the grid
        let gridApi;
        
        // 3. Convert CSV to JSON format for AG Grid
        function processCSV(csvText) {
            const results = Papa.parse(csvText, {
                header: true, // First row becomes field names
                skipEmptyLines: true
            });
            
            if (results.errors.length > 0) {
                console.error('CSV parsing errors:', results.errors);
                return { columns: [], rows: [] };
            }
            
            const rows = results.data;
            const columns = results.meta.fields.map((fieldName, index) => {
                return {
                    headerName: fieldName,
                    field: fieldName,
                    sortable: true,
                    filter: true,
                    // Freeze first two columns (index 0 and 1)
                    pinned: index < 2 ? 'left' : null,
                    width: index < 2 ? 120 : 100,
                    cellStyle: index < 2 ? { 
                        backgroundColor: '#f8f9fa',
                        fontWeight: '500'
                    } : {}
                };
            });
            
            return { columns, rows };
        }
        
        // 4. Fetch data from Google Sheet
        async function fetchTimetableData() {
            try {
                // Add cache busting to prevent browser caching
                const url = GOOGLE_SHEET_CSV_URL + '&cachebust=' + new Date().getTime();
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const csvText = await response.text();
                return processCSV(csvText);
                
            } catch (error) {
                console.error('Error fetching data:', error);
                alert('Failed to load timetable data. Please try again.');
                return { columns: [], rows: [] };
            }
        }
        
        // 5. Initialize and populate the grid
        async function initializeGrid() {
            const gridDiv = document.querySelector('#myGrid');
            
            // Grid configuration
            const gridOptions = {
                columnDefs: [], // Will be populated with data
                rowData: [],    // Will be populated with data
                defaultColDef: {
                    resizable: true,
                    filter: 'agTextColumnFilter',
                    floatingFilter: true,
                    cellStyle: { 
                        'font-size': '13px',
                        'font-family': "'Roboto', Arial, sans-serif"
                    }
                },
                // Enable freezing (pinning) of rows
                pinnedTopRowData: [],
                // Enable row selection
                rowSelection: 'multiple',
                suppressRowClickSelection: true,
                // Performance optimizations
                animateRows: true,
                // Ensure frozen columns are visually clear
                enableCellTextSelection: true,
                ensureDomOrder: true,
                // THEME ENHANCEMENTS
                headerHeight: 40,
                rowHeight: 35,
                suppressHorizontalScroll: false,
                // Match Google Sheets look
                defaultExcelExportParams: {
                    fontSize: 11,
                }
            };
            
            // Create the grid
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
            
            // Load initial data
            await refreshGrid();
        }
        
        // 6. Refresh function (called by button)
        async function refreshGrid() {
            const statusEl = document.getElementById('lastUpdateTime');
            statusEl.textContent = 'Loading...';
            
            const { columns, rows } = await fetchTimetableData();
            
            if (gridApi) {
                // Update columns if structure changed
                gridApi.setGridOption('columnDefs', columns);
                
                // Update rows
                gridApi.setGridOption('rowData', rows);
                
                // Set first two rows as frozen (pinned)
                if (rows.length >= 2) {
                    gridApi.setGridOption('pinnedTopRowData', [rows[0], rows[1]]);
                } else if (rows.length === 1) {
                    gridApi.setGridOption('pinnedTopRowData', [rows[0]]);
                }
                
                // Auto-size columns to fit content
                gridApi.sizeColumnsToFit();
            }
            
            // Update timestamp
            const now = new Date();
            statusEl.textContent = now.toLocaleTimeString();
            console.log(`Timetable updated at ${now.toLocaleString()}`);
        }
        
        // 7. Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeGrid);
        
        // 8. Optional: Auto-refresh every 5 minutes (commented out)
        // setInterval(refreshGrid, 300000);
    </script>
</body>
</html>
